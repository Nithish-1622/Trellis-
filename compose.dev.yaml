services:
  client:
    build:
      target: development
    ports: !override
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    restart: "no"

  api:
    build:
      target: development
    ports: !override
      - "8085:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./server:/app
    restart: "no"

  db:
    ports:
      - "5432:5432"
    restart: "no"

volumes:
  client_node_modules:
